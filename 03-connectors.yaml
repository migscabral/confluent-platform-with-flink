apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: confluent
stringData:
  s3.properties: |
    aws.access.key.id=${S3_ACCESS_KEY}
    aws.secret.access.key=${S3_SECRET_KEY}
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: confluent
stringData:
  mysql.properties: |
    connection.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    connection.user=${MYSQL_USERNAME}
    connection.password=${MYSQL_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: confluent
stringData:
  mongodb.properties: |
    connection.uri=${MONGODB_URI}
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: s3-sink
  namespace: confluent
spec:
  connectClusterRef:
    name: connect
  class: io.confluent.connect.s3.S3SinkConnector
  taskMax: 1
  configs:
    topics: ${S3_SOURCE_TOPIC}
    s3.bucket.name: ${S3_BUCKET}
    s3.region: ${S3_REGION}
    topics.dir: ${S3_PREFIX}
    storage.class: io.confluent.connect.s3.storage.S3Storage
    format.class: io.confluent.connect.s3.format.json.JsonFormat
    partitioner.class: io.confluent.connect.storage.partitioner.DefaultPartitioner
    flush.size: "1000"
    schema.compatibility: NONE
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
    aws.access.key.id: "${file:/mnt/secrets/s3-credentials/s3.properties:aws.access.key.id}"
    aws.secret.access.key: "${file:/mnt/secrets/s3-credentials/s3.properties:aws.secret.access.key}"
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: mysql-sink
  namespace: confluent
spec:
  connectClusterRef:
    name: connect
  class: io.confluent.connect.jdbc.JdbcSinkConnector
  taskMax: 1
  configs:
    topics: ${MYSQL_SOURCE_TOPIC}
    connection.url: "${file:/mnt/secrets/mysql-credentials/mysql.properties:connection.url}"
    connection.user: "${file:/mnt/secrets/mysql-credentials/mysql.properties:connection.user}"
    connection.password: "${file:/mnt/secrets/mysql-credentials/mysql.properties:connection.password}"
    table.name.format: ${MYSQL_TABLE}
    insert.mode: insert
    auto.create: "false"
    auto.evolve: "false"
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: mongodb-sink
  namespace: confluent
spec:
  connectClusterRef:
    name: connect
  class: com.mongodb.kafka.connect.MongoSinkConnector
  taskMax: 1
  configs:
    topics: ${MONGODB_SOURCE_TOPIC}
    connection.uri: "${file:/mnt/secrets/mongodb-credentials/mongodb.properties:connection.uri}"
    database: ${MONGODB_DATABASE}
    collection: ${MONGODB_COLLECTION}
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
